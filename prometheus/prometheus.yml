global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    project: business-using-homework-4
    env: local-demo

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "credit_model"
    scrape_interval: 5s
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels:
          model: "catboost-credit-g"

  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]
